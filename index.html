<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="google-adsense-account" content="ca-pub-1924890349431110">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2a2350">
<meta http-equiv="refresh" content="6;url=https://zaibgames.com/">
<title>Taking a break | Zaib Games</title>
<link rel="icon" href="/favicon.ico">
<style>
html,body{margin:0;height:100%}
body{display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#2a2350,#4b3c8f);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
main{max-width:420px}
.emoji{font-size:64px;line-height:1}
h1{font-size:28px;margin:16px 0 8px}
p{font-size:18px;line-height:1.5;margin:0 0 24px;opacity:.92}
a.btn{display:inline-block;background:#ffd23f;color:#2a2350;font-weight:700;font-size:20px;text-decoration:none;padding:14px 28px;border-radius:999px;box-shadow:0 4px 0 #c9a21f}
a.btn:hover,a.btn:focus{background:#ffe170}
small{display:block;margin-top:20px;opacity:.7;font-size:14px}
</style>
</head>
<body>
<main>
<div class="emoji" aria-hidden="true">😴</div>
<h1>This game is taking a break</h1>
<p>Find more fun games at Zaib Games!</p>
<a class="btn" href="https://zaibgames.com/">Play more games</a>
<small>Taking you to Zaib Games in a few seconds…</small>
</main>
<script>
if("serviceWorker"in navigator&&navigator.serviceWorker.getRegistrations){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){if(r.scope.indexOf("/message-not-sent/")>-1)r.unregister()})}).catch(function(){})}
if(window.caches&&caches.keys){caches.keys().then(function(ks){ks.forEach(function(k){if(k.indexOf("message-not-sent-")===0)caches.delete(k)})}).catch(function(){})}
</script>
</body>
</html>
